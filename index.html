<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>○番目にピュアな私</title>
    <style>
        html{
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            padding-top: 20px;
        }

        .image img{
            width: 100%;
            pointer-events: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -moz-touch-collout: none;
            -moz-user-select: none;
        }
        
        h1{
            white-space: nowrap;
            scroll-margin-top: 10px;
        }

        audio {
            width: 100%;
            max-width: 500px; 
            margin: 10px 0;
            display: block;
        }

        .audio-block {
            background-color: #f0f8ff;
            border-radius: 12px;
            padding: 16px;
            margin: 20px 0;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .audio-block h3 {
            margin-top: 0;
            font-size: 1.2em;
        }

        .jump_eng{
            font-weight: bold;
            font-size: 1.2em;
            text-decoration: none;
            background: #ec84a7;
            color: white;
            margin: 0px 10px;
            padding: 7px 15px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <a class="jump_eng" href="#instruction_eng">▶ English version here</a>

    <h1>【プレイ用ミュージック】</h1>

    <div  class="audio-block">
        <h3>▼🐣初プレイ時はこちら🐣▼</h3>
        <audio controls src="level1.mp3" type="audio/mp3">プレイ用ミュージック１</audio>
    </div>

    <div class="audio-block">
        <h3>▼　慣れてきたらこちら　▼</h3>
        <audio controls src="level2.mp3" type="audio/mp3">プレイ用ミュージック２</audio>
    </div>

    <div class="audio-block">
        <h3>▼　極めた方はこちら　▼</h3>
        <audio controls src="level3.mp3" type="audio/mp3">プレイ用ミュージック３</audio>
    </div>

    <div class="image">
        <img src="instruction.jpeg" alt="シマエナガ説明書" onselectstart="return false;" onmousedown="return false;">
    </div>

    <h1 id="instruction_eng">【GAME MUSIC】</h1>

    <div  class="audio-block">
        <h3>▼ easy ▼</h3>
        <audio controls src="level1.mp3" type="audio/mp3">プレイ用ミュージック１</audio>
    </div>

    <div class="audio-block">
        <h3>▼ normal ▼</h3>
        <audio controls src="level2.mp3" type="audio/mp3">プレイ用ミュージック２</audio>
    </div>

    <div class="audio-block">
        <h3>▼ crazy ▼</h3>
        <audio controls src="level3.mp3" type="audio/mp3">プレイ用ミュージック３</audio>
    </div>

    <div class="image">
        <img src="instruction_eng.jpg" alt="simaenaga setumeisyo" onselectstart="return false;" onmousedown="return false;">
    </div>

    <script>
        const audios = document.querySelectorAll("audio");

        audios.forEach(audio =>{
            audio.addEventListener('play', () => {
                audios.forEach(otherAudio => {
                    if (otherAudio != audio && !otherAudio.paused) {
                        otherAudio.pause();
                        otherAudio.currentTime = 0;
                    }
                });
            });

            audio.addEventListener("pause", () =>{
                if(audio.currentTime > 0 && !audio.ended)
                {
                    audio.currentTime = 0;
                }
            });
        });
    </script>
</body>
</html>
